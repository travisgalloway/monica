# Sparse-upcycle SOURCE fixture (#214): a degenerate n_experts=1 "MoE" block, which IS a
# plain dense SwiGLU FFN (softmax over one logit is exactly 1.0, MoEBlock._moe takes the
# k==E branch — see MambaConfig.validate()'s n_experts==1 carve-out). This is the shape
# #200's real dense checkpoint is trained at: NOT a plain non-MoE config, because
# `scripts/upcycle.py` needs `experts.0.{gate,up,down}` keys to replicate into the real
# target's expert slots, and only an n_experts=1 MoE block has them.
#
# Pairs with toy-moe-fine.yaml (the upcycle TARGET) below. `check_upcycle_compatible`
# requires the pair to agree on every NON-expert dimension — `src/train/upcycle.py`'s
# `_MUST_MATCH` deliberately compares the RESOLVED properties (d_model, n_layers,
# d_state, expand, d_conv, head_dim, dt_rank_resolved, d_inner, n_heads, vocab_size,
# tie_embeddings, attn_every, n_attn_heads_resolved, moe_every, moe_d_ff_resolved)
# rather than the raw Optional fields they derive from, so "auto"/None on one side and
# an equal concrete value on the other compare equal — only n_experts/top_k/
# moe_balance_rate may differ. Matching the non-expert backbone is NECESSARY but NOT
# SUFFICIENT to make a real dense checkpoint a valid upcycle source for a real MoE
# target: moe_d_ff_resolved also has to match whatever width the target uses. That
# constraint is now recorded in docs/design/13-code-model-moe.md (the source-shape note
# under MHM-P5) and docs/design/07-configs-and-decisions.md; this fixture pair is the
# executable version of it.
d_model: 64
n_layers: 4
d_state: 16            # SSM state width N (per head)
expand: 2               # d_inner = 128
d_conv: 4
head_dim: 16            # Mamba-2/SSD: 128/16 = 8 SSM heads (scalar A per head)
dt_rank: auto

# Sparse MoE: every 2nd block is a SwiGLU MoE FFN instead of a Mamba block, matching
# toy-moe-fine.yaml's interleave exactly (both are required to for the upcycle).
moe_every: 2            # layers 1 and 3 (0-indexed (i+1)%2==0) are MoE
n_experts: 1             # degenerate: ONE expert == a plain dense SwiGLU FFN (#214)
top_k: 1                 # validate() REQUIRES top_k==1 whenever n_experts==1
# A deliberately NON-DEFAULT expert width (d_inner/8 = 128/8 = 16), matching
# toy-moe-fine.yaml. The point is to prove the upcycle carries moe_d_ff through rather
# than silently working only at the `null -> d_inner` default — moe_d_ff_resolved is one
# of the 15 fields check_upcycle_compatible requires to match.
#
# This is a FIXTURE width, not #200's. #200 must match whatever the real target uses:
# #272 (resolved 2026-08-09) settled Large A at moe_d_ff == d_inner (full width), so
# #200's dense FFN blocks are full-width too. An earlier version of this comment said the
# real checkpoint had to be narrow like this fixture; that was wrong — see
# docs/design/13-code-model-moe.md's resolved note under MHM-P5.
moe_d_ff: 16
# A single expert can never be balanced (sign(mean - load) == sign(0) == 0 forever, since
# the one expert's load IS the mean); validate() REJECTS a non-null rate here.
moe_balance_rate: null

vocab_size: 256          # byte-fallback tokenizer for offline tests
seq_len: 64
tie_embeddings: true

precision: fp32           # correctness first; fp32 makes forward/step parity exact
chunk_size: null          # SSD chunk length Q (null -> backend default 64)
grad_checkpoint: false    # tiny; keep tests cheap

# dt-projection bias init (load-bearing — identical across all configs by design)
dt_min: 0.001
dt_max: 0.1
dt_init_floor: 0.0001
