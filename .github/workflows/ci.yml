name: CI

# Standing CI for the portable test suite, the seam guard, the M4 smoke gate
# (resume-exactness + eval), and the native Swift tokenizer's cross-platform
# parity gate. See issue #249 for the Python design record and #246 for the
# Swift jobs.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # #267: the poc-scale Swift parity gate (jobs 9/10 below) runs ONLY on
  # workflow_dispatch or this weekly schedule — never on pull_request/push. Monday
  # 09:17 UTC, an off-the-hour time to avoid the top-of-hour GitHub Actions scheduler
  # crunch.
  schedule:
    - cron: "17 9 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Job 1: portable suite + seam guard (Linux, no mlx, no torch) ──────────
  # This is the one environment where test_import_guard.py's
  # test_portable_modules_do_not_import_backends is unambiguous: mlx isn't
  # installable on Linux, and torch is deliberately not installed in this job
  # (it lives in smoke-linux instead), so any backend import above the seam
  # fails loudly rather than being masked by a locally-present backend.
  portable:
    name: portable (pytest, no backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,data]"
      - name: pytest
        run: pytest -q -rs

  # ── Job 2: smoke gate on Linux/CPU-torch (hardware-independent guarantee) ─
  # Separate job from `portable`, not a step in it, so torch never enters
  # portable's environment. Installs the CPU torch wheel first so the later
  # editable install (which never requests the `cuda` extra) doesn't pull a
  # different torch. That editable install is bare (no `[dev,data]`): this
  # job runs no pytest (dev/pytest unused) and the smoke path below has no
  # module-level pyarrow/fsspec/datasets/transformers imports (data unused).
  smoke-linux:
    name: smoke gate (Linux, CPU torch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e .
      - name: Build a fresh toy split
        # The gotcha this encodes: scripts/smoke_test.py needs a FRESHLY BUILT
        # toy split, never data/split (which holds the real OLMo-vocab
        # corpus). config/toy.yaml is vocab_size 256 (byte-fallback), so this
        # needs no network, no HF token, and not even the `data` extra.
        # Built under $RUNNER_TEMP so nothing lands in the checkout.
        run: |
          python -m src.data.download --dummy --out "$RUNNER_TEMP/toy/raw" --max-docs 2000
          python -m src.data.tokenize --in "$RUNNER_TEMP/toy/raw/dummy.txt" \
                 --out "$RUNNER_TEMP/toy/ids.npy" --byte-fallback
          python -m src.data.pack  --in "$RUNNER_TEMP/toy/ids.npy" --out "$RUNNER_TEMP/toy/packed.bin"
          python -m src.data.split --packed "$RUNNER_TEMP/toy/packed.bin" \
                 --out "$RUNNER_TEMP/toy/split" --val-tokens 2000
      - name: Smoke gate (CUDA backend, CPU device)
        run: |
          python scripts/smoke_test.py --backend cuda \
                 --data "$RUNNER_TEMP/toy/split" --out "$RUNNER_TEMP/smoke"
      - name: Smoke gate (CUDA backend, MoE config, gather impl)
        # --moe-impl is new (#214); this is the only CI coverage of the gather
        # dispatch path end-to-end through the real training loop/resume path,
        # not just the unit-level tests/test_cuda_moe_gather.py comparisons.
        run: |
          python scripts/smoke_test.py --backend cuda --config config/toy-moe.yaml \
                 --moe-impl gather --data "$RUNNER_TEMP/toy/split" --out "$RUNNER_TEMP/smoke-moe"

  # ── Job 3: CUDA test suite on CPU torch (#214) ─────────────────────────────
  # Without this job, EVERY test_cuda_*.py test skips in CI: `portable` has no torch
  # (by design — the seam guard needs that ambiguity-free) and `smoke-linux` installs
  # torch but runs no pytest, only scripts/smoke_test.py. This is deliberately a
  # SEPARATE job from `portable`, not a step in it, for the same reason smoke-linux is
  # separate: torch must never enter portable's environment. `[dev,data]` (no `cuda`
  # extra) is enough — torch itself is installed from the CPU wheel index first, same
  # as smoke-linux, so the CUDA backend's "torch on CPU" fallback path is what runs
  # here (fused=False, no real GPU). bitsandbytes/transformer-engine are NOT installed
  # (`cuda-8bit`/`cuda-fp8` are separate extras) — the 8-bit-optimizer and fp8 tests
  # stay hardware/library-gated and skip here too; see docs/infrastructure.md's manual
  # verification section for what only a real GPU pod can confirm.
  cuda-cpu:
    name: CUDA test suite (Linux, CPU torch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev,data]"
      - name: pytest (CUDA backend + backend_parity tests only)
        run: pytest -q -rs tests/test_cuda_*.py tests/test_backend_parity.py

  # ── Job 4: full suite + smoke gate on macOS/MLX (arm64) ───────────────────
  # macos-latest is arm64, so the mlx wheel installs and the ~19 mlx-gated
  # test files actually run instead of skipping.
  full-macos:
    name: full suite + smoke gate (macOS, MLX)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,data,mlx]"
      - name: Build the Swift tokenizer (for the Parquet parity test)
        # This is the only job with both Python/pyarrow and a Swift toolchain, so it's what
        # turns tests/test_swift_parquet.py from a local check into a gate (#247). ~30s.
        working-directory: swift
        run: swift build
      - name: pytest
        run: pytest -q -rs
      - name: Build a fresh toy split
        run: |
          python -m src.data.download --dummy --out "$RUNNER_TEMP/toy/raw" --max-docs 2000
          python -m src.data.tokenize --in "$RUNNER_TEMP/toy/raw/dummy.txt" \
                 --out "$RUNNER_TEMP/toy/ids.npy" --byte-fallback
          python -m src.data.pack  --in "$RUNNER_TEMP/toy/ids.npy" --out "$RUNNER_TEMP/toy/packed.bin"
          python -m src.data.split --packed "$RUNNER_TEMP/toy/packed.bin" \
                 --out "$RUNNER_TEMP/toy/split" --val-tokens 2000
      - name: Smoke gate (MLX backend)
        run: |
          python scripts/smoke_test.py --backend mlx \
                 --data "$RUNNER_TEMP/toy/split" --out "$RUNNER_TEMP/smoke"

  # ── Job 5: native Swift toolchain, macOS (#246) ───────────────────────────
  # swift/Package.swift declares NO .testTarget and there is no Tests/ dir, so
  # `swift test` finds nothing — monica-selfcheck is the actual runner
  # (dependency-free, no XCTest, exits non-zero on any failure). Swift ships
  # with Xcode on macos-latest, so there is no toolchain install step.
  swift-macos:
    name: swift selfcheck (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        working-directory: swift
        run: swift build
      - name: Self-check
        working-directory: swift
        run: swift run monica-selfcheck
      # ── #197: the native LSP harness's binary-free self-test (framing/demux/trie/
      # scanner over pipe(2) — no subprocess, no node). Runs on both swift-macos and
      # swift-linux; see the macOS-only live-server steps further down for the parts
      # that actually need a typescript-language-server toolchain.
      - name: MonicaLSP self-check (framing/demux/trie/scanner — no subprocess)
        working-directory: swift
        run: swift run monica-lsp --self-test
      - name: Guard — swift/ (MonicaTokenizer + MonicaLSP) stays dependency-free (#167/#197)
        # A new MonicaLSP TARGET adds no dependency edge; this is what proves it. Run here
        # (not just once, at the bottom of swift-engine) so a regression on this specific
        # job is caught directly rather than via a distant guard step.
        working-directory: swift
        run: |
          OUT=$(swift package show-dependencies --format flatlist)
          echo "output: '$OUT'"
          [ -z "$OUT" ]
      - name: Train the parity corpus
        # Fixed corpus in, tokenizer.json out — compared byte-for-byte against
        # the Linux job's copy in swift-parity below. TokenizerFormat.save uses
        # JSONEncoder [.prettyPrinted, .sortedKeys] over Int/String-only fields,
        # so identical merges must serialize to identical bytes.
        working-directory: swift
        run: |
          swift run monica-tokenize train \
            --in Fixtures/parity-corpus.jsonl \
            --out "$RUNNER_TEMP/tokenizer.json" --vocab-size 2000
          shasum -a 256 "$RUNNER_TEMP/tokenizer.json"
      - uses: actions/upload-artifact@v4
        with:
          name: tokenizer-macos
          path: ${{ runner.temp }}/tokenizer.json
          retention-days: 7
      - name: Pack the parity corpus with FIM (#215)
        # FIM insertion is seeded (SplitMix64, integer-only, no stdlib random
        # conveniences) precisely so this output is bit-identical to the Linux
        # job's. An in-process "pack twice, same bytes" check runs on ONE machine
        # and therefore cannot catch a platform-divergent RNG; only the cmp in
        # swift-parity can. `--fim-rate 0.5` sits at the top of #215's intended
        # 0.4-0.5 band, so this exercises the transform on most documents.
        working-directory: swift
        run: |
          swift run monica-tokenize pack \
            --tokenizer "$RUNNER_TEMP/tokenizer.json" \
            --in Fixtures/parity-corpus.jsonl --out "$RUNNER_TEMP/fim-shards" \
            --seq-len 64 --shard-size-mb 1 --fim-rate 0.5 --fim-seed 1234 | tee "$RUNNER_TEMP/fim.log"
          # An empty pack would leave swift-parity cmp-ing two nonexistent files
          # and reading as a pass. A check that cannot observe its target is BLIND.
          grep -qE '^packed [1-9][0-9]* seq' "$RUNNER_TEMP/fim.log"
          grep -qE '^fim: [1-9][0-9]*/' "$RUNNER_TEMP/fim.log"
      - uses: actions/upload-artifact@v4
        with:
          name: fim-shards-macos
          path: ${{ runner.temp }}/fim-shards
          retention-days: 7
      # ── #197: the parts of MonicaLSP that need a real typescript-language-server —
      # macOS-only (this job has the pinned node_modules toolchain; swift-linux does not
      # install node at all, matching how the rest of this job's fixture files are
      # macOS-only too).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the pinned typescript-language-server toolchain (#194's set)
        working-directory: eval_sets/ts_error_injection
        run: npm ci
      - name: MonicaLSP --probe-reap — every ProcessSupervisor exit path, with the orphan check (V7)
        # The gating check from the plan: a shell wrapper around the live-server run that
        # asserts a child was actually observed (BLIND guard) and that nothing outlives it.
        working-directory: swift
        run: |
          BEFORE=$(pgrep -f 'typescript-language-server|tsserver' | wc -l | tr -d ' ')
          swift run monica-lsp --probe-reap | tee "$RUNNER_TEMP/probe.log"
          grep -q '^spawned_pid=' "$RUNNER_TEMP/probe.log" || { echo "BLIND: no child was ever spawned"; exit 2; }
          grep -q '^FAIL:' "$RUNNER_TEMP/probe.log" && { echo "probe-reap reported a FAIL line above"; exit 1; }
          sleep 2
          AFTER=$(pgrep -f 'typescript-language-server|tsserver' | wc -l | tr -d ' ')
          [ "$AFTER" -le "$BEFORE" ] || { echo "ORPHAN: $BEFORE -> $AFTER"; pgrep -afl 'tsserver'; exit 1; }
      - name: MonicaLSP --bench — Swift fast-loop latency vs the Python reference (V8)
        working-directory: swift
        run: |
          swift run monica-lsp --bench --n-files 500 --iters 100 \
            --out "$RUNNER_TEMP/swift_lsp_bench.json"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python (stdlib-only src/lsp — no data/mlx/torch needed for this check)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Python fast-loop bench, same synthetic project shape, for comparison
        run: |
          python scripts/bench_ts_lsp.py --n-files 500 --warmup 10 --iters 100 \
            --out "$RUNNER_TEMP/ts_lsp_bench.json"
          echo "--- Swift ---"; cat "$RUNNER_TEMP/swift_lsp_bench.json"
          echo "--- Python ---"; cat "$RUNNER_TEMP/ts_lsp_bench.json"
      - uses: actions/upload-artifact@v4
        with:
          name: lsp-bench-records
          path: |
            ${{ runner.temp }}/swift_lsp_bench.json
            ${{ runner.temp }}/ts_lsp_bench.json
          retention-days: 90
      - name: Mask-set parity, no checked-in oracle (V5)
        # Both sides compute the SAME fixed synthetic vocab/label/prefix cases from
        # scratch and are compared with a byte cmp — no numeric oracle checked in (#195's
        # lesson). The Python side is generated at run time from src/serve/constrained.py,
        # NOT imported from monica-lsp's own logic, so this is a real cross-language check.
        run: |
          swift run --package-path swift monica-lsp --emit-mask-parity "$RUNNER_TEMP/swift-mask-parity.json"
          python3 - "$RUNNER_TEMP/py-mask-parity.json" <<'PYEOF'
          import json, sys
          sys.path.insert(0, ".")
          from src.serve.constrained import VocabTrie, allowed_extensions
          VOCAB = ["x", "y", "length", "len", "toString", "to", "String", ".", " ",
                   "toLowerCase", "toUpperCase", "foo", "fooBar", "_bar", "1", "2",
                   "a", "ab", "abc", "!"]
          LABELS = ["length", "toString", "toLowerCase", "toUpperCase", "x", "y", "abc"]
          EXIT_IDS = [7, 8, 19]
          PREFIXES = ["", "to", "len", "x", "abc", "ab", "zzz"]
          trie = VocabTrie(VOCAB)
          cases = [{"prefix": p, "allowed": sorted(allowed_extensions(trie, LABELS, p, exit_ids=EXIT_IDS))}
                   for p in PREFIXES]
          with open(sys.argv[1], "w") as f:
              f.write(json.dumps({"cases": cases}, separators=(",", ":")) + "\n")
          PYEOF
          diff "$RUNNER_TEMP/swift-mask-parity.json" "$RUNNER_TEMP/py-mask-parity.json"

  # ── Job 6: native Swift toolchain, Linux (#246) ───────────────────────────
  # The official swift image (Ubuntu 24.04, glibc 2.39) — the same toolchain the
  # CUDA host would use. Zero external package dependencies, and the image
  # already carries git/tar, so no apt step is needed.
  swift-linux:
    name: swift selfcheck (Linux, swift:latest)
    runs-on: ubuntu-latest
    container:
      image: swift:latest
    timeout-minutes: 20
    steps:
      # checkout runs as root inside the container; pre-trusting the workspace
      # keeps git's dubious-ownership check from tripping the build.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        working-directory: swift
        run: swift build
      - name: Self-check
        working-directory: swift
        run: swift run monica-selfcheck
      # #197: binary-free (no subprocess, no node) — must pass on Linux too, since
      # MonicaLSP lives inside `swift/` and this job compiles/runs it like everything else
      # here. The live-server steps (npm-installed toolchain) are macOS-only, in swift-macos.
      - name: MonicaLSP self-check (framing/demux/trie/scanner — no subprocess)
        working-directory: swift
        run: swift run monica-lsp --self-test
      - name: Train the parity corpus
        working-directory: swift
        run: |
          swift run monica-tokenize train \
            --in Fixtures/parity-corpus.jsonl \
            --out "$RUNNER_TEMP/tokenizer.json" --vocab-size 2000
          sha256sum "$RUNNER_TEMP/tokenizer.json"
      - uses: actions/upload-artifact@v4
        with:
          name: tokenizer-linux
          path: ${{ runner.temp }}/tokenizer.json
          retention-days: 7
      - name: Pack the parity corpus with FIM (#215)
        # Must match the macOS job's flags exactly — swift-parity cmp's the two.
        working-directory: swift
        run: |
          swift run monica-tokenize pack \
            --tokenizer "$RUNNER_TEMP/tokenizer.json" \
            --in Fixtures/parity-corpus.jsonl --out "$RUNNER_TEMP/fim-shards" \
            --seq-len 64 --shard-size-mb 1 --fim-rate 0.5 --fim-seed 1234 | tee "$RUNNER_TEMP/fim.log"
          grep -qE '^packed [1-9][0-9]* seq' "$RUNNER_TEMP/fim.log"
          grep -qE '^fim: [1-9][0-9]*/' "$RUNNER_TEMP/fim.log"
      - uses: actions/upload-artifact@v4
        with:
          name: fim-shards-linux
          path: ${{ runner.temp }}/fim-shards
          retention-days: 7

  # ── Job 7: the bit-identical guarantee itself (#246) ──────────────────────
  # #191/#245's whole premise is that the Swift tokenizer produces identical
  # vocab/ids on the Mac dev box and the Linux/CUDA host. This job is what
  # makes that claim a gate rather than a comment.
  swift-parity:
    name: tokenizer bit-identity (macOS vs Linux)
    runs-on: ubuntu-latest
    needs: [swift-macos, swift-linux]
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tokenizer-macos
          path: macos
      - uses: actions/download-artifact@v4
        with:
          name: tokenizer-linux
          path: linux
      - name: Diff the two tokenizer.json
        # cmp reports the first differing byte/line, which is far more useful
        # than a bare hash mismatch when this ever does fail.
        run: |
          sha256sum macos/tokenizer.json linux/tokenizer.json
          cmp macos/tokenizer.json linux/tokenizer.json
      - uses: actions/download-artifact@v4
        with:
          name: fim-shards-macos
          path: fim-macos
      - uses: actions/download-artifact@v4
        with:
          name: fim-shards-linux
          path: fim-linux
      - name: Diff the two FIM-packed shard sets (#215)
        # The cross-platform determinism gate for FIM insertion. A divergent RNG
        # (or any float creeping into the transform) shows up here and nowhere
        # else. manifest.json holds only ints and fixed strings — no paths, no
        # floats — so it is safely byte-comparable. Diff the full file lists
        # (not a hardcoded part-00000.* set) so a future fixture that packs to
        # multiple shard parts still gets every part compared, not silently
        # skipped past the first.
        run: |
          test -s fim-macos/part-00000.bin   # non-empty, or the diff below is vacuous
          diff <(cd fim-macos && find . -type f | sort) <(cd fim-linux && find . -type f | sort)
          while IFS= read -r f; do
            sha256sum "fim-macos/$f" "fim-linux/$f"
            cmp "fim-macos/$f" "fim-linux/$f"
          done < <(cd fim-macos && find . -type f | sort)

  # ── Job 8: the Swift/MLX model port's logit parity gate (#166) ────────────
  # Apple-only: swift/engine/ is a SEPARATE SwiftPM package that depends on
  # mlx-swift, deliberately kept OUT of swift/Package.swift so the tokenizer
  # package stays dependency-free and swift-linux keeps needing no network for
  # dependencies (platform conditions gate build edges, not RESOLUTION — SwiftPM
  # would still clone mlx-swift's vendored C++ tree on Linux). Jobs 4/5/6 are
  # untouched by design. See docs/design/14-inference-engine.md.
  #
  # `swift run monica-parity` compares the Swift model's forward AND stacked-step
  # logits against checked-in Python/MLX references at fp32 rtol=1e-4/atol=1e-5.
  swift-engine:
    name: swift model parity (macOS, mlx-swift)
    runs-on: macos-latest
    # mlx-swift builds the vendored `mlx` C++ tree from source; a COLD runner
    # build is plausibly 20-40 min, hence the generous timeout and the cache.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        # Piped to a file (in addition to stdout) so the cache key below can
        # hashFiles() it — restoring a .build-xcode built by a different
        # Swift/Xcode toolchain (macos-latest images roll forward) risks a
        # flaky build, so the toolchain identity must be part of the key.
        run: swift --version | tee .swift-toolchain-version
      # mlx-swift's Cmlx target links a `default.metallib` (its Metal shader
      # kernels) that plain `swift build`/`swift run` never compiles — SwiftPM
      # CLI builds only produce the C++/Swift object code. `default.metallib`
      # is an Xcode-only build product (see ml-explore/mlx-swift Package.swift's
      # "PrepareMetalShaders" comment, and ml-explore/mlx-swift#345, which
      # documents the same gap for downstream SPM consumers). Confirmed by
      # trial: `swift build` succeeds and `swift run monica-parity` still fails
      # with "Failed to load the default metallib. library not found" even
      # with the MetalToolchain component present — no `.metal` compile step
      # ever appears in `swift build`'s log. The fix is to build with
      # `xcodebuild` (which mlx-swift's own CI does, via its aggregate
      # `-Package` scheme) instead of `swift build`, then run the executable
      # xcodebuild produced in DerivedData.
      - name: Ensure Metal toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -downloadComponent MetalToolchain || true
          xcodebuild -showComponent MetalToolchain
          xcrun -sdk macosx metal --version
      - uses: actions/cache@v4
        with:
          path: swift/engine/.build-xcode
          key: swift-engine-${{ runner.os }}-${{ hashFiles('swift/engine/Package.resolved') }}-${{ hashFiles('.swift-toolchain-version') }}
      - name: Build (xcodebuild, so mlx-swift's Metal kernels actually get compiled)
        working-directory: swift/engine
        run: |
          # mlx-swift's own Cmlx target carries a build-tool plugin (CudaBuild, a
          # no-op on macOS). xcodebuild requires interactively trusting package
          # plugins before first use; -skipPackagePluginValidation is the
          # documented non-interactive-CI bypass (there is no prompt to answer
          # in a headless runner, so without it xcodebuild hard-fails on
          # "Validate plug-in \"CudaBuild\" in package \"mlx-swift\"").
          xcodebuild build -scheme MonicaEngine-Package -destination 'platform=macOS' \
            -derivedDataPath .build-xcode -skipPackagePluginValidation
      - name: Logit + greedy-id parity vs the Python MLX oracle
        # As of #167, monica-parity also gates AC1: greedy-decode ids exactly match
        # generation.safetensors (exported alongside the logit reference) for every fixture.
        working-directory: swift/engine
        run: |
          BIN=$(find .build-xcode/Build/Products -type f -name monica-parity -perm -u+x -print -quit)
          if [ -z "$BIN" ]; then
            echo "monica-parity binary not found under .build-xcode/Build/Products" >&2
            find .build-xcode/Build/Products -maxdepth 3 >&2 || true
            exit 1
          fi
          "$BIN"
      # ── #195: monica-train — the training-step + optimizer parity gate ──
      - name: monica-train --self-test (DynamicLossScaler policy, no MLX math needed)
        working-directory: swift/engine
        run: |
          BIN=$(find .build-xcode/Build/Products -type f -name monica-train -perm -u+x -print -quit)
          if [ -z "$BIN" ]; then
            echo "monica-train binary not found under .build-xcode/Build/Products" >&2
            find .build-xcode/Build/Products -maxdepth 3 >&2 || true
            exit 1
          fi
          echo "MONICA_TRAIN_BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN" --self-test
      - name: monica-train fixture gate (loss / grad-norm / grad-tree / post-step-weights)
        # The tolerance-calibration round trip: this is the FIRST execution of mlx-swift's
        # autodiff against the Swift engine (mlx-swift cannot run on the CLT-only dev
        # host at all, see docs/design/14-inference-engine.md's #195 entry) — achieved
        # max|d| per surface is printed even on success, so a first-run failure here is
        # expected to be diagnosed via that output, not treated as a flake.
        working-directory: swift/engine
        run: "$MONICA_TRAIN_BIN"
      - name: monica-train --overflow-check (fp16 skip branch, end to end)
        working-directory: swift/engine
        run: "$MONICA_TRAIN_BIN --overflow-check toy"
      - name: monica-train --train (free-running, the issue's literal decreasing-loss AC)
        working-directory: swift/engine
        run: "$MONICA_TRAIN_BIN --train Fixtures/toy --steps 20 --lr 1e-3"
      # ── #167: the generation CLI, self-test + tokenizer-free + native-tokenizer paths ──
      - name: monica-generate self-test (sampler semantics, no weights/MLX needed)
        working-directory: swift/engine
        run: |
          BIN=$(find .build-xcode/Build/Products -type f -name monica-generate -perm -u+x -print -quit)
          if [ -z "$BIN" ]; then
            echo "monica-generate binary not found under .build-xcode/Build/Products" >&2
            find .build-xcode/Build/Products -maxdepth 3 >&2 || true
            exit 1
          fi
          echo "MONICA_GENERATE_BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN" --self-test
      - name: monica-generate AC2 — tokenizer-free debug path (--prompt-ids)
        working-directory: swift/engine
        run: |
          OUT=$("$MONICA_GENERATE_BIN" --weights Fixtures/toy/weights.safetensors \
            --prompt-ids 3,1,4,1,5 --temperature 0 --max-new-tokens 8)
          echo "$OUT"
          # A check that cannot observe its target must never read green: assert non-empty
          # output, not just a zero exit code.
          [ -n "$OUT" ]
      - name: monica-generate AC2 — native MonicaTokenizer end to end
        # This is the step that makes "encode/decode go through the native MonicaTokenizer"
        # a gate rather than a comment. `toy-gen` (vocab 512) exists precisely because a
        # monica-tokenize-trained tokenizer's vocab (256 base bytes + specials) cannot fit
        # toy.yaml's default 256-wide model.
        run: |
          cd swift
          swift run monica-tokenize train --in Fixtures/parity-corpus.jsonl \
            --out "$RUNNER_TEMP/gen-tokenizer.json" --vocab-size 512
          cd engine
          OUT=$("$MONICA_GENERATE_BIN" --weights Fixtures/toy-gen/weights.safetensors \
            --tokenizer "$RUNNER_TEMP/gen-tokenizer.json" --prompt 'function ' \
            --temperature 0 --max-new-tokens 8)
          echo "$OUT"
          [ -n "$OUT" ]
      # ── #197: end-to-end native masked decode (V9) — the one item that is CI-only on
      # this host (mlx-swift needs Metal, which needs Xcode's compiled metallib; this job
      # gets that via the xcodebuild step above, unlike a plain `swift build`).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the pinned typescript-language-server toolchain (#194's set)
        working-directory: eval_sets/ts_error_injection
        run: npm ci
      - name: monica-generate --lsp-mask end to end (V9)
        run: |
          cd swift
          swift run monica-tokenize train --in Fixtures/parity-corpus.jsonl \
            --out "$RUNNER_TEMP/gen-tokenizer.json" --vocab-size 512
          cd engine
          OUT=$("$MONICA_GENERATE_BIN" --weights Fixtures/toy-gen/weights.safetensors \
            --tokenizer "$RUNNER_TEMP/gen-tokenizer.json" --prompt 'function foo() { return 1; }' \
            --temperature 0 --max-new-tokens 8 --lsp-mask \
            --lsp-eval-set-dir "$GITHUB_WORKSPACE/eval_sets/ts_error_injection")
          echo "$OUT"
          # A masked run that silently fell back to unconstrained (e.g. the toolchain
          # resolving to nil and the flag being ignored) would print the SAME thing as the
          # unmasked step above and read as a false pass — so this asserts non-empty output
          # AND that the process didn't fail() on toolchain resolution (fail() exits 1,
          # which the command substitution above would have already surfaced).
          [ -n "$OUT" ]
      - name: monica-generate AC3 — prefill bench (#169, informational)
        # NOT a gate: hosted-runner timing is noisy, so no threshold assertion. It DOES
        # assert the two prefill paths' argmax id AGREES (a correctness property, not a
        # timing one) and that the output is non-empty — a bench that cannot observe its
        # target must not read green. The printed ms/speedup feed
        # docs/design/14-inference-engine.md and a comment on #169.
        working-directory: swift/engine
        run: |
          OUT=$("$MONICA_GENERATE_BIN" --weights Fixtures/toy/weights.safetensors \
            --bench-prefill --bench-prompt-len 128 --bench-iterations 5)
          echo "$OUT"
          [ -n "$OUT" ]
      # ── #170: monica-bench — the benchmark harness ──
      - name: monica-bench --self-test (deterministic, hardware-independent — GATE)
        # Unlike the timing steps below, this one DOES gate: analytic byte arithmetic,
        # the quant target-selection filter, and baseline-comparison logic are all
        # pure/deterministic, so there is no noisy-hosted-runner excuse for this to fail.
        working-directory: swift/engine
        run: |
          BIN=$(find .build-xcode/Build/Products -type f -name monica-bench -perm -u+x -print -quit)
          if [ -z "$BIN" ]; then
            echo "monica-bench binary not found under .build-xcode/Build/Products" >&2
            find .build-xcode/Build/Products -maxdepth 3 >&2 || true
            exit 1
          fi
          echo "MONICA_BENCH_BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN" --self-test
      - name: monica-bench --mode all on Fixtures/toy (informational timing, gated correctness)
        # NOT a timing gate — hosted-runner numbers are noisy (see docs/benchmarks.md).
        # It DOES gate the prefill argmax-agreement assertion (Bench.prefill fails loud
        # on disagreement) and non-empty/finite output — a bench that cannot observe its
        # target must not read green.
        working-directory: swift/engine
        run: |
          OUT=$("$MONICA_BENCH_BIN" --weights Fixtures/toy/weights.safetensors --mode all \
            --json "$RUNNER_TEMP/monica-bench-toy.json")
          echo "$OUT"
          [ -n "$OUT" ]
      - name: monica-bench --mode decode on Fixtures/toy-moe-int8 (quantized path, informational)
        # Exercises the quantized checkpoint path (Checkpoint.load applies the `quant`
        # sidecar automatically) — informational for the same reason as the step above.
        working-directory: swift/engine
        run: |
          OUT=$("$MONICA_BENCH_BIN" --weights Fixtures/toy-moe-int8/weights.safetensors \
            --mode decode --json "$RUNNER_TEMP/monica-bench-toy-moe-int8.json")
          echo "$OUT"
          [ -n "$OUT" ]
      - name: Upload monica-bench JSON records
        uses: actions/upload-artifact@v4
        with:
          name: monica-bench-records
          path: |
            ${{ runner.temp }}/monica-bench-toy.json
            ${{ runner.temp }}/monica-bench-toy-moe-int8.json
          retention-days: 90
      # ── #196: checkpoint I/O — the Swift WRITER round-trips into Python ──
      # `monica-parity`'s own round-trip section (Checkpoint.swift's `save`, gated
      # above as part of "Logit + greedy-id parity") only proves Swift can read back
      # what Swift wrote. The issue's other acceptance direction — "a checkpoint
      # written by Swift loads and runs in Python" — can only be proven by a Python
      # process, hence the two steps below.
      - name: Emit Swift-written checkpoints for the Python round-trip gate
        # Cheap: the binary is already built and every fixture is tiny. Reruns the
        # same binary rather than adding a second executable/target.
        working-directory: swift/engine
        run: |
          BIN=$(find .build-xcode/Build/Products -type f -name monica-parity -perm -u+x -print -quit)
          if [ -z "$BIN" ]; then
            echo "monica-parity binary not found under .build-xcode/Build/Products" >&2
            exit 1
          fi
          "$BIN" --roundtrip-out "$RUNNER_TEMP/swift-ckpt"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python (mlx only — no data/torch needed for this check)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mlx]"
      - name: Swift -> Python checkpoint round trip (GATE)
        # Closes the direction `monica-parity`'s own round trip cannot: sidecar
        # dict equality, quant-block equality, key-set equality, and forward logits
        # vs reference.safetensors, for every checkpoint the step above emitted. An
        # empty --roundtrip-dir is a FAILURE in this script, not a silent pass — see
        # scripts/check_swift_checkpoint.py's module docstring. If Python setup ever
        # makes this job noticeably slower, the documented fallback (see that
        # script's docstring and #196's plan) is to upload
        # "$RUNNER_TEMP/swift-ckpt" as an artifact and run this check in a small
        # separate `needs:`-gated macOS job instead of inline here.
        run: |
          python scripts/check_swift_checkpoint.py \
            --roundtrip-dir "$RUNNER_TEMP/swift-ckpt" \
            --fixtures swift/engine/Fixtures
      - name: Guard — swift/ (MonicaTokenizer) stays dependency-free (#167)
        # Cheap, and it fails loudly the day someone "simplifies" the two packages into one.
        # The engine -> tokenizer edge (Package.swift) must never become tokenizer -> engine.
        run: |
          cd swift
          OUT=$(swift package show-dependencies --format flatlist)
          echo "output: '$OUT'"
          [ -z "$OUT" ]

  # ── Job 9a: the training-fixture oracle, generation side (#195) ────────────
  # Dispatch/schedule-only, same rationale and pattern as poc-fixture-oracle/
  # poc-parity below (#267) — this regenerates train.safetensors/meta.json for the
  # three training fixtures (toy/toy-hybrid/toy-moe) ON DEMAND; it is not part of
  # every-PR CI. Landed after the #195/PR #293 Phase-0 diagnostic
  # (`.claude/plans/issue-195-unblock.md`) established that MLX's Metal conv1d
  # weight-gradient reduction is HOST-FAMILY dependent — not within-host
  # nondeterministic, and not an MLX-version artifact (both sides measured
  # mlx 0.32.0): two independent generations on two separate macos-latest runners
  # agreed to ~1.5e-8 (fp32 noise floor) while BOTH differed from a
  # locally-generated (non-CI-hardware) oracle by up to 1.83e-2 on
  # grad.*.conv.weight — exceeding the tensor's own absmax, i.e. not accumulated
  # rounding. `tests/test_train_parity_fixture_export.py` and
  # `swift model parity (macOS, mlx-swift)`'s `monica-train` step both run on this
  # SAME macos-latest runner family, so the checked-in oracle must be GENERATED on
  # that family too. See docs/design/14-inference-engine.md's #195 entry for the
  # full record and the regeneration command in
  # swift/engine/Fixtures/README.md.
  train-fixture-oracle:
    name: train fixture oracle — generate (macOS, Python MLX)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (mlx only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mlx]"
      - name: Host facts
        run: |
          python -c "import mlx.core as mx; print('mlx', mx.__version__)"
          sysctl -n machdep.cpu.brand_string
          sw_vers
      - name: Export all three training fixtures (fresh process, this runner)
        # Exact flags from swift/engine/Fixtures/README.md's "Regenerating" command.
        run: |
          python scripts/export_parity_fixture.py --config config/toy.yaml \
            --out "$RUNNER_TEMP/oracle/toy" --batch 2 --seq 129 --train-steps 3 \
            --packed-doc-lengths "Q,2*Q,5"
          python scripts/export_parity_fixture.py --config config/toy-hybrid.yaml \
            --out "$RUNNER_TEMP/oracle/toy-hybrid" --batch 2 --seq 40 --train-steps 3 \
            --packed-doc-lengths "Q,7,Q+3"
          python scripts/export_parity_fixture.py --config config/toy-moe.yaml \
            --out "$RUNNER_TEMP/oracle/toy-moe" --batch 2 --seq 40 --train-steps 3 \
            --packed-doc-lengths "Q,7,Q+3"
      - name: "Manifest (meta.json + train.safetensors only, the only host-sensitive files)"
        run: |
          cd "$RUNNER_TEMP/oracle"
          find . \( -name meta.json -o -name train.safetensors \) | sort \
            | xargs shasum -a 256 > "$RUNNER_TEMP/oracle-manifest.txt"
          cat "$RUNNER_TEMP/oracle-manifest.txt"
          # Anti-BLIND: exactly 6 files (3 fixtures x {meta.json, train.safetensors}).
          N=$(wc -l < "$RUNNER_TEMP/oracle-manifest.txt")
          [ "$N" -eq 6 ] || { echo "BLIND: expected 6 files, got $N"; exit 2; }
      - name: "Print the uploaded tree (observed, not guessed: see PR #301, #167)"
        run: find "$RUNNER_TEMP/oracle-manifest.txt" "$RUNNER_TEMP/oracle" -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: train-fixture-oracle
          path: |
            ${{ runner.temp }}/oracle-manifest.txt
            ${{ runner.temp }}/oracle/toy/meta.json
            ${{ runner.temp }}/oracle/toy/train.safetensors
            ${{ runner.temp }}/oracle/toy-hybrid/meta.json
            ${{ runner.temp }}/oracle/toy-hybrid/train.safetensors
            ${{ runner.temp }}/oracle/toy-moe/meta.json
            ${{ runner.temp }}/oracle/toy-moe/train.safetensors
          retention-days: 30
          if-no-files-found: error

  # ── Job 9b: the training-fixture oracle, cross-process verification (#195) ──
  # The #298 two-process guard, reused exactly (not reinvented): a SECOND
  # independent generation, in a fresh process on a second runner, must agree
  # byte-for-byte with job 9a's upload before either is trusted as an oracle —
  # this GATES (unlike the Phase-0 diagnostic's report-only comparison), because
  # a mismatch here would mean the "generate on CI" fix itself rests on an
  # unstable quantity.
  train-fixture-oracle-verify:
    name: train fixture oracle — verify (macOS, Python MLX)
    runs-on: macos-latest
    needs: [train-fixture-oracle]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (mlx only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mlx]"
      - name: Export all three training fixtures (fresh process, a SECOND independent runner)
        run: |
          python scripts/export_parity_fixture.py --config config/toy.yaml \
            --out "$RUNNER_TEMP/oracle2/toy" --batch 2 --seq 129 --train-steps 3 \
            --packed-doc-lengths "Q,2*Q,5"
          python scripts/export_parity_fixture.py --config config/toy-hybrid.yaml \
            --out "$RUNNER_TEMP/oracle2/toy-hybrid" --batch 2 --seq 40 --train-steps 3 \
            --packed-doc-lengths "Q,7,Q+3"
          python scripts/export_parity_fixture.py --config config/toy-moe.yaml \
            --out "$RUNNER_TEMP/oracle2/toy-moe" --batch 2 --seq 40 --train-steps 3 \
            --packed-doc-lengths "Q,7,Q+3"
      - name: Manifest
        run: |
          cd "$RUNNER_TEMP/oracle2"
          find . \( -name meta.json -o -name train.safetensors \) | sort \
            | xargs shasum -a 256 > "$RUNNER_TEMP/oracle2-manifest.txt"
          N=$(wc -l < "$RUNNER_TEMP/oracle2-manifest.txt")
          [ "$N" -eq 6 ] || { echo "BLIND: expected 6 files, got $N"; exit 2; }
      - uses: actions/download-artifact@v4
        with:
          name: train-fixture-oracle
          path: downloaded
      - name: Print the downloaded tree (observed, not guessed)
        run: find downloaded -type f | sort
      - name: "Manifest diff (informational — see the GATE step below for why this isn't the gate)"
        # Manifests hash relative "./fixture/file" paths (both sides ran `find .` from
        # their own oracle root), so they are directly comparable despite the
        # upload/download directory nesting being different from the local one. NOT
        # asserted on: unlike poc's pure-forward logits (bit-reproducible across
        # processes), the gradient reduction this oracle carries has measured ~1e-8
        # jitter between separate runner INSTANCES of the same host family (see the
        # GATE step) — byte-exact would be a false-negative gate here.
        run: |
          test -s downloaded/oracle-manifest.txt || { echo "BLIND: uploaded manifest missing/empty"; exit 2; }
          N=$(wc -l < downloaded/oracle-manifest.txt)
          [ "$N" -eq 6 ] || { echo "BLIND: short uploaded manifest ($N lines)"; exit 2; }
          echo "--- runner 1 (uploaded) manifest ---"; cat downloaded/oracle-manifest.txt
          echo "--- runner 2 (this job) manifest ---"; cat "$RUNNER_TEMP/oracle2-manifest.txt"
          if diff downloaded/oracle-manifest.txt "$RUNNER_TEMP/oracle2-manifest.txt" > /tmp/mf.diff; then
            echo "RESULT: byte-exact match"
          else
            echo "RESULT: NOT byte-exact (expected — see GATE step for the numeric check)"
            cat /tmp/mf.diff
          fi
      - name: "GATE — two independent CI-runner generations must agree within the staleness-guard tolerance"
        # The Phase-0 diagnostic (.claude/plans/issue-195-unblock.md) measured ~1.5e-8
        # max|d| between two independent same-host-family generations — real but far
        # inside train_rtol=2e-4/train_atol=1e-6 (tests/test_train_parity_fixture_export.py),
        # the SAME band the checked-in oracle will be compared against in production. So
        # the correct guard here is "would this pair pass the actual staleness gate",
        # not exact-byte equality — the latter is what poc-parity uses because pure
        # forward-pass logits ARE bit-reproducible across processes; this oracle's
        # gradient reduction is not, even within one host family.
        run: |
          for f in toy toy-hybrid toy-moe; do
            test -s "downloaded/oracle/$f/train.safetensors" || { echo "BLIND: downloaded $f/train.safetensors missing/empty"; exit 2; }
            test -s "$RUNNER_TEMP/oracle2/$f/train.safetensors" || { echo "BLIND: this-job $f/train.safetensors missing/empty"; exit 2; }
          done
          python3 - "$RUNNER_TEMP/oracle2" <<'PYEOF'
          import sys
          import numpy as np
          from safetensors.numpy import load_file

          oracle2_dir = sys.argv[1]
          RTOL, ATOL = 2e-4, 1e-6   # tests/test_train_parity_fixture_export.py's own band
          bad = []
          for f in ("toy", "toy-hybrid", "toy-moe"):
              a = load_file(f"downloaded/oracle/{f}/train.safetensors")
              b = load_file(f"{oracle2_dir}/{f}/train.safetensors")
              if set(a) != set(b):
                  print(f"BLIND: {f} key sets differ between the two runners")
                  sys.exit(2)
              worst = None
              for k in a:
                  d = np.abs(a[k].astype(np.float64) - b[k].astype(np.float64))
                  ok = np.allclose(a[k], b[k], rtol=RTOL, atol=ATOL)
                  maxd = float(d.max())
                  if not ok:
                      bad.append((f, k, maxd))
                  if worst is None or maxd > worst[1]:
                      worst = (k, maxd)
              print(f"{f}: {len(a)} keys, worst max|d|={worst[1]:.3e} at {worst[0]!r}")
          if bad:
              print("GATE FAILED — outside train_rtol/train_atol:")
              for f, k, maxd in bad:
                  print(f"  {f}[{k!r}] max|d|={maxd:.3e}")
              sys.exit(1)
          print(f"GATE PASSED — both runners agree within train_rtol={RTOL}/train_atol={ATOL}")
          PYEOF
      - name: Per-fixture meta.json (for the record)
        run: |
          for f in toy toy-hybrid toy-moe; do
            echo "--- $f ---"; cat "downloaded/oracle/$f/meta.json"
          done

  # ── Job 9: the poc-scale parity oracle, generation side (#267) ────────────
  # Dispatch/schedule-only — see the `on:` block above. Generation side of the
  # two-process #298 guard job 10 completes: #298 (MLX 0.32.0 buffer-reuse
  # corruption) is deterministic PER PROCESS, so two independent fresh-process
  # generations, on two separate runners, have to corrupt identically to survive
  # the manifest `diff` in job 10. Python+MLX only — NO Swift toolchain, so this
  # job cannot be contaminated by the thing it is generating an oracle FOR.
  # Uploads a ~2 KB manifest, never the 571 MB fixture itself: job 10 regenerates
  # its own copy in ~6 s, which is both cheaper than moving the bytes and
  # strictly stronger evidence (two processes, two runners, not one process
  # trusted twice).
  poc-fixture-oracle:
    name: poc parity oracle — generate (macOS, Python MLX)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (mlx only — no data/torch needed to export a fixture)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mlx]"
      - name: Export the poc-scale fixture
        # config/poc.yaml is fp16 by default; --precision fp32 overrides it (the harness
        # gates fp32 — see export_parity_fixture.py's --precision help). Measured on an
        # M1 Pro during planning: 5.77s wall, 571 MB output.
        run: |
          /usr/bin/time -l python scripts/export_parity_fixture.py \
            --config config/poc.yaml --precision fp32 --batch 1 --seq 128 \
            --out "$RUNNER_TEMP/poc-fixture"
          du -sh "$RUNNER_TEMP/poc-fixture"
          cat "$RUNNER_TEMP/poc-fixture/meta.json"
      - name: Manifest (relative paths, so job 10's own copy is comparable)
        run: |
          cd "$RUNNER_TEMP/poc-fixture"
          find . -type f | sort | xargs shasum -a 256 > "$RUNNER_TEMP/poc-manifest.txt"
          cat "$RUNNER_TEMP/poc-manifest.txt"
          # A manifest that cannot observe its target must never read green: an empty
          # or short manifest would `cmp` clean against another equally-empty one. Exactly
          # 7 files: generation/inputs/meta.json/prefill/reference/weights.safetensors +
          # weights.safetensors.config.json.
          N=$(wc -l < "$RUNNER_TEMP/poc-manifest.txt")
          [ "$N" -eq 7 ] || { echo "BLIND: expected 7 fixture files, got $N"; exit 2; }
          grep -q 'weights.safetensors$' "$RUNNER_TEMP/poc-manifest.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: poc-fixture-manifest
          path: |
            ${{ runner.temp }}/poc-manifest.txt
            ${{ runner.temp }}/poc-fixture/meta.json
          retention-days: 30
          if-no-files-found: error      # never let an empty artifact upload look like success

  # ── Job 10: the poc-scale parity gate, Swift consumer side (#267) ─────────
  # Dispatch/schedule-only. `needs: [swift-engine, poc-fixture-oracle]` — depending on
  # swift-engine is deliberate and free: it makes this job start AFTER swift-engine has
  # written the `swift-engine-${{ runner.os }}-…` xcodebuild cache, so this job's
  # mlx-swift build is a warm restore + incremental build rather than a second cold
  # 20-40 min vendored-C++ compile. It does NOT modify swift-engine itself — that job
  # gains no `needs:`, so it can never be skip-propagated by this new dependency.
  poc-parity:
    name: poc parity gate (macOS, mlx-swift, dispatch/schedule only)
    runs-on: macos-latest
    needs: [swift-engine, poc-fixture-oracle]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version | tee .swift-toolchain-version
      # Same rationale as swift-engine's identical step above: mlx-swift's Metal kernels
      # need Xcode's `metal` compiler, which plain `swift build` never invokes.
      - name: Ensure Metal toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -downloadComponent MetalToolchain || true
          xcodebuild -showComponent MetalToolchain
          xcrun -sdk macosx metal --version
      - uses: actions/cache@v4
        with:
          path: swift/engine/.build-xcode
          # IDENTICAL key to swift-engine's cache, plus a restore-keys prefix: this job
          # wants a warm restore of the cache swift-engine (an earlier job in this same
          # run, via `needs:`) just wrote, not a fresh cold build.
          key: swift-engine-${{ runner.os }}-${{ hashFiles('swift/engine/Package.resolved') }}-${{ hashFiles('.swift-toolchain-version') }}
          restore-keys: |
            swift-engine-${{ runner.os }}-
      - name: Build (xcodebuild, so mlx-swift's Metal kernels actually get compiled)
        working-directory: swift/engine
        run: |
          xcodebuild build -scheme MonicaEngine-Package -destination 'platform=macOS' \
            -derivedDataPath .build-xcode -skipPackagePluginValidation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (mlx only — no data/torch needed to export a fixture)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mlx]"
      - name: Regenerate the fixture in THIS job's own fresh process
        # The other half of the #298 cross-process guard: a second, independent
        # generation on a SECOND runner, in a fresh Python process that has never touched
        # job 9's. #298's corruption is deterministic per-process, so two independent
        # processes have to corrupt identically to fool the diff below.
        run: |
          python scripts/export_parity_fixture.py \
            --config config/poc.yaml --precision fp32 --batch 1 --seq 128 \
            --out "$RUNNER_TEMP/poc-fixture"
          cd "$RUNNER_TEMP/poc-fixture"
          find . -type f | sort | xargs shasum -a 256 > "$RUNNER_TEMP/poc-manifest-local.txt"
      - uses: actions/download-artifact@v4      # errors (fails the job) if the artifact is absent
        with:
          name: poc-fixture-manifest
          path: oracle
      - name: "#298 guard — two fresh processes on two runners must agree byte-for-byte"
        # This MUST run, and pass, BEFORE monica-parity below ever reads poc-fixture — an
        # oracle that disagrees with its own independent regeneration is not a valid
        # oracle regardless of what the Swift side says about it.
        run: |
          test -s oracle/poc-manifest.txt || { echo "BLIND: oracle manifest missing/empty"; exit 2; }
          N=$(wc -l < oracle/poc-manifest.txt)
          [ "$N" -eq 7 ] || { echo "BLIND: short oracle manifest ($N lines)"; exit 2; }
          diff oracle/poc-manifest.txt "$RUNNER_TEMP/poc-manifest-local.txt"
          # upload-artifact's multi-path least-common-ancestor is $RUNNER_TEMP (shared by
          # poc-manifest.txt and poc-fixture/meta.json in job 9), so the poc-fixture/
          # subdir survives into the download — the file lands at oracle/poc-fixture/meta.json,
          # not oracle/meta.json.
          test -s oracle/poc-fixture/meta.json || { echo "BLIND: oracle meta.json missing/empty"; exit 2; }
          diff <(python3 -c 'import json,sys;print(json.dumps(json.load(open(sys.argv[1])),sort_keys=True))' oracle/poc-fixture/meta.json) \
               <(python3 -c 'import json,sys;print(json.dumps(json.load(open(sys.argv[1])),sort_keys=True))' "$RUNNER_TEMP/poc-fixture/meta.json")
      - name: Record the poc-scale tolerance headroom (informational, but printed)
        # NOT a threshold check — src/conformance/tolerances.py's fp32 band (rtol=1e-4/
        # atol=1e-5, reused unmodified — see #267's scope) is enforced by the exporter
        # itself (it refuses to write a fixture that fails its own forward/step parity
        # check) and by monica-parity's gate step below. This just makes the measured
        # numbers a standing CI observation instead of a one-off in a plan file.
        run: |
          python3 -c "import json;m=json.load(open('$RUNNER_TEMP/poc-fixture/meta.json'));print('forward_step_max_abs_diff=%s greedy_margin_min=%s prefill_decode_max_abs_diff=%s' % (m['forward_step_max_abs_diff'], m['greedy_margin_min'], m['prefill_decode_max_abs_diff']))"
      - name: Swift logit + greedy-id parity at poc scale (GATE)
        working-directory: swift/engine
        run: |
          BIN=$(find .build-xcode/Build/Products -type f -name monica-parity -perm -u+x -print -quit)
          if [ -z "$BIN" ]; then
            echo "monica-parity binary not found under .build-xcode/Build/Products" >&2
            find .build-xcode/Build/Products -maxdepth 3 >&2 || true
            exit 1
          fi
          "$BIN" --fixtures "$RUNNER_TEMP/poc-fixture" | tee "$RUNNER_TEMP/poc-parity.log"
          # Exit 0 is not sufficient evidence a real comparison happened: main.swift
          # already fails on an empty fixture set ("no fixtures to check"), but this makes
          # the observation explicit at this call site too — a check that cannot observe
          # its target must never read green.
          grep -qE '^OK — all 1 fixtures pass forward \+ step parity' "$RUNNER_TEMP/poc-parity.log"
      - name: Guard — swift/ (MonicaTokenizer) stays dependency-free (#167)
        run: |
          cd swift
          OUT=$(swift package show-dependencies --format flatlist)
          echo "output: '$OUT'"
          [ -z "$OUT" ]
